<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="options-form">
    <div class="url-title">
      <p class="title-text">External URL Patterns <a
          href="https://developer.mozilla.org/en-US/docs/Mozilla/Add-ons/WebExtensions/Match_patterns" target="_blank"
          title="URL pattern reference">(?)</a></p>
    </div>
    <div class="url-form">
      <div class="url-input">
        <input type="url" id="patternInput" class="url-input__field" placeholder="*://*.example.org/*" />
        <button type="button" id="addPatternButton" class="url-input__action btn--big">Add</button>
      </div>
      <div class="pattern-list">
        <select id="patternList" class="pattern-list__select" multiple></select>
        <button id="removePatternsButton" class="pattern-list__action btn--small"
          title="Delete selected patterns">Delete</button>
      </div>
    </div>
    <div class="button-panel">
      <button id="saveButton" class="button-panel__action btn--big" disabled
        title="Save current set of patterns">Save</button>
      <button id="resetButton" class="button-panel__action btn--big"
        title="Reload the currently saved patterns">Reset</button>
      <button id="defaultsButton" class="button-panel__action btn--big" title="Load the default patterns">Load
        Defaults</button>
    </div>
    <hr class="test-divider">
    <div class="test-panel">
      <p class="title-text">Test a URL:</p>
      <div class="url-input">
        <input type="url" id="urlInput" class="url-input__field" placeholder="https://www.example.org" />
        <button type="button" id="testUrlButton" class="url-input__action btn--big">Test</button>
      </div>
    </div>
    <p id="statusLabel" class="status-label"></p>
  </div>
  <script src="options.js"></script>
</body>

</html>
